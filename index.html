<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Personal OS</title>
    <meta name="description" content="Journal, notas, tareas, hábitos y foco. Privado y en tu iPhone." />
    <meta name="theme-color" content="#fdfcfa" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Personal OS" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('pos-theme') || '{}');
          var t = p.theme || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.dataset.theme = dark ? 'dark' : 'light';
          r.dataset.accent = p.accent || 'crimson';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#171514' : '#fdfcfa');
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #fdfcfa; }
      html[data-theme='dark'] { background: #171514; }
      #splash { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9999; background: inherit; transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1); }
      #splash .mark { width: 60px; height: 60px; border-radius: 16px; background: #2b2825; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
      #splash .mark i { width: 18px; height: 18px; border-radius: 50%; background: #c43a3f; }
      #splash.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="mark"><i></i></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
